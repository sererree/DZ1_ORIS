<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль пользователя</title>
</head>
<body>
    <h1>Профиль пользователя</h1>
    <p>Имя: ${Name}</p>
    <p>Возраст: ${Age}</p>
    <p>Email: ${Email}</p>
    $if(IsActive)
    <p>Пользователь активен</p>
$else
    <p>Пользователь неактивен</p>
$endif
<h2>Хобби</h2>
<ul>
$foreach(var hobby in Hobbies)
    <li>${hobby}</li>
$endfor
</ul>
</body>
</html>
